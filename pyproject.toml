[project]
name = "simplecomfy"
version = "0.2.0"
description = "Simple local image generation via managed ComfyUI — preset-first, no guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "tomli>=2.0.0; python_version < '3.11'",
  "huggingface-hub>=0.25.0",
  "pyyaml>=6.0",
  "aiofiles>=24.1.0",
  "imageio-ffmpeg>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
simplecomfy = "simplecomfy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/simplecomfy"]

# Map app/simplecomfy → import simplecomfy
[tool.hatch.build.targets.wheel.sources]
"app" = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
